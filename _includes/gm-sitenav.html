<nav class="gm-sitenav" id="gm-sitenav" aria-label="Site navigation">
  <a href="/" class="gm-sitenav-home">Government Methods</a>
  <div class="gm-sitenav-links">
    <a href="/methodsbrownbag/">Brown Bag</a>
    <a href="/mathcamp/">Math Camp</a>
    <a href="/notes/">Newsletter</a>
    <a href="/about.html">About</a>
    <a href="/submit.html">Submit</a>
    <a href="/ask.html">Ask</a>
  </div>
</nav>
<script>
  (function () {
    var p = window.location.pathname;
    // Site root only. A bare endsWith("/index.html") also matched
    // /notes/index.html and stripped that page of its nav and title.
    var isIndex = (p === "/" || p === "/index.html");

    if (isIndex) {
      // Hide nav on the home page — it has its own full-page navigation.
      // The class lets styles.scss hide Quarto's title block here only;
      // inner pages keep it as their one H1.
      document.documentElement.classList.add("gm-home");
      var nav = document.getElementById("gm-sitenav");
      if (nav) nav.style.display = "none";
      return;
    }

    // Mark current page link. Resolve the href first: Quarto rewrites the
    // site-absolute hrefs written above into page-relative ones ("../notes/"),
    // so comparing the raw attribute against the path never matched and no
    // inner page was ever marked. A directory target matches by prefix, so
    // /notes/posts/foo.html keeps "Newsletter" lit; a page target matches
    // exactly. Keep both tests narrow -- a loose match once had "/" matching
    // /notes/index.html, which stripped that page of its nav entirely.
    document.querySelectorAll(".gm-sitenav-links a").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href) return;
      var target = new URL(href, window.location.href).pathname;
      var hit = target.endsWith("/")
        ? p.indexOf(target) === 0
        : p === target;
      if (hit) a.setAttribute("aria-current", "page");
    });

    document.addEventListener("DOMContentLoaded", function () {
      // Move the theme toggle into the nav bar, where the books keep theirs.
      // Its click handler is delegated on document, so position is free.
      // It goes after the links strip, not inside it: the strip scrolls
      // horizontally on narrow screens and would carry the toggle off-screen.
      var toggle = document.querySelector(".gm-theme-toggle--fixed");
      var nav = document.getElementById("gm-sitenav");
      if (toggle && nav) {
        toggle.classList.remove("gm-theme-toggle--fixed");
        nav.appendChild(toggle);
      }

      // Wrap page body content (everything except the sitenav) in a
      // centering div, since theme:none produces no main/content wrapper.
      var wrapper = document.createElement("div");
      wrapper.className = "gm-article-content";
      var toWrap = Array.from(document.body.children).filter(function (el) {
        return el.id !== "gm-sitenav" &&
               !el.classList.contains("gm-theme-toggle--fixed") &&
               el.tagName !== "SCRIPT";
      });
      if (toWrap.length) {
        document.body.insertBefore(wrapper, toWrap[0]);
        toWrap.forEach(function (el) { wrapper.appendChild(el); });
      }
    });
  })();
</script>
